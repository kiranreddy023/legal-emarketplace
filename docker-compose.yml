version: "3.9"

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backendapp
    ports:
      - "5000:5000"
    command: npm run dev
    depends_on:
      - mongodb
    networks:
      - myappnet
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontendapp
    ports:
      - "3000:3000"
    command: npm start
    networks:
      - myappnet
    depends_on:
      - backend
    environment:
      - NODE_ENV=development

networks:
  myappnet:
    driver: bridge

volumes:
  mongo_data: